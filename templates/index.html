<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Pagine dei Giornali</title>

<link rel="icon" href="/static/logo.png" type="image/png">
<link rel="apple-touch-icon" href="/static/logo.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#111111">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root {
    --carta: #f4efe4;
    --carta-scura: #e9e2d0;
    --inchiostro: #1a1a1a;
    --rosso: #7a1f1f;
    --grigio-testo: #5a5548;
  }

  body {
    font-family: 'Source Serif 4', Georgia, serif;
    background: var(--carta);
    background-image: repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
    margin: 0;
    padding: 20px;
    color: var(--inchiostro);
  }

  .intestazione { display:flex; flex-direction:column; align-items:center; margin-bottom:6px; }
  .intestazione img { width:220px; height:220px; border-radius:24px; background:#fff; box-shadow: 0 3px 10px rgba(0,0,0,.25); }

  h1 { text-align:center; font-family: 'Playfair Display', Georgia, serif; font-weight:900; font-size:44px; color: var(--inchiostro); margin: 16px 0 4px; letter-spacing: 0.5px; }
  .sottotitolo { text-align:center; color: var(--rosso); font-family: 'Source Serif 4', serif; font-style: italic; font-size: 15px; margin-bottom: 26px; border-top: 2px solid var(--inchiostro); border-bottom: 2px solid var(--inchiostro); padding: 6px 0; max-width: 360px; margin-left:auto; margin-right:auto; }

  .info-sezione { text-align:center; font-size:14px; color:var(--grigio-testo); margin-bottom:20px; }

  .filtri { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:20px; }
  .filtro { padding:8px 16px; background:#fffdf8; border:2px solid #d8d0ba; border-radius:6px; cursor:pointer; font-size:13px; transition:all .2s; }
  .filtro:hover { border-color:var(--rosso); }
  .filtro.attivo { background:var(--inchiostro); color:var(--carta); border-color:var(--inchiostro); }

  .ricerca-box { text-align:center; margin-bottom:24px; }
  .ricerca-box input { padding:10px 14px; width:90%; max-width:360px; border:1px solid #d8d0ba; border-radius:6px; font-family:inherit; font-size:15px; }

  .grid { display:flex; flex-wrap:wrap; gap:24px; justify-content:center; align-items:flex-start; }

  .card { position:relative; background:#fffdf8; border-radius:4px; box-shadow: 0 3px 10px rgba(0,0,0,.18); overflow:hidden; width:420px; max-width:95vw; border: 1px solid #d8d0ba; }
  .card.nascosto { display:none; }
  .card h2 { margin:0; padding:14px 16px; background: var(--inchiostro); color: var(--carta); font-family: 'Playfair Display', Georgia, serif; font-weight:700; font-size:20px; letter-spacing:0.5px; }
  .card .categoria-icon { font-size:10px; margin-right:6px; }

  .contenitore-immagine { position:relative; background: var(--carta-scura); min-height: 200px; }
  .scheletro { position:absolute; inset:0; background: linear-gradient(100deg, #e9e2d0 30%, #f4efe4 50%, #e9e2d0 70%); background-size: 200% 100%; animation: scorrimento 1.4s ease-in-out infinite; }
  @keyframes scorrimento { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .card img.prima-pagina { position:relative; z-index:1; width:100%; height:auto; display:block; object-fit:contain; opacity:0; transition: opacity .35s ease; }
  .card img.prima-pagina.caricata { opacity:1; }

  .data { text-align:center; padding:10px; font-size:13px; color: var(--grigio-testo); font-style:italic; border-top:1px solid #e3dbc5; }

  .stella { position:absolute; top:8px; right:12px; background:none; border:none; font-size:22px; cursor:pointer; color:#8a8474; line-height:1; padding:4px; z-index:2; }
  .stella.attiva { color:#d4a017; }
</style>
</head>
<body>

<div class="intestazione">
  <img src="/static/logo.png" alt="Logo Prime Pagine">
</div>
<h1>Prime Pagine di Oggi</h1>
<div class="sottotitolo">I quotidiani italiani, tutti in un unico luogo</div>

<div class="info-sezione">
  <span id="contatore">Caricamento...</span>
</div>

<div class="filtri">
  <button class="filtro attivo" data-categoria="tutti">Tutti</button>
  <button class="filtro" data-categoria="nazionale">🇮🇹 Nazionale</button>
  <button class="filtro" data-categoria="economia">💼 Economia</button>
  <button class="filtro" data-categoria="regionale">🏛️ Regionale</button>
</div>

<div class="ricerca-box">
  <input type="text" id="ricerca" placeholder="Cerca un giornale...">
</div>

<div class="grid" id="grid">
  {% for chiave, nome in giornali.items() %}
  <div class="card" data-chiave="{{ chiave }}" data-nome="{{ nome }}" data-categoria="
  {%- if chiave in ['corriere', 'repubblica', 'sole24ore', 'ilgiornale'] -%}
    nazionale
  {%- elif chiave in ['stampa', 'domani'] -%}
    economia
  {%- elif chiave in ['quotidianolecce', 'gazzettamezzogiorno'] -%}
    regionale
  {%- else -%}
    nazionale
  {%- endif -%}
  ">
    <button class="stella" onclick="toggleFavorito('{{ chiave }}', this)">★</button>
    <h2><span class="categoria-icon" data-icon="
    {%- if chiave in ['corriere', 'repubblica', 'sole24ore', 'ilgiornale'] -%}
      🇮🇹
    {%- elif chiave in ['stampa', 'domani'] -%}
      💼
    {%- elif chiave in ['quotidianolecce', 'gazzettamezzogiorno'] -%}
      🏛️
    {%- else -%}
      🇮🇹
    {%- endif -%}
    "></span>{{ nome }}</h2>
    <div class="contenitore-immagine">
      <div class="scheletro"></div>
      <img class="prima-pagina" src="/img/{{ chiave }}" alt="Prima pagina {{ nome }}"
           onload="this.classList.add('caricata'); this.previousElementSibling.style.display='none';"
           onerror="this.onerror=null; this.src='https://via.placeholder.com/500x650?text=Immagine+non+disponibile'; this.classList.add('caricata'); this.previousElementSibling.style.display='none';">
    </div>
    <div class="data data-agg"></div>
  </div>
  {% endfor %}
</div>

<script>
  document.querySelectorAll('.data-agg').forEach(el => el.textContent = 'Verifica in corso...');

  fetch('/aggiornamenti')
    .then(r => r.json())
    .then(dati => {
      document.querySelectorAll('.card').forEach(c => {
        const chiave = c.dataset.chiave;
        const el = c.querySelector('.data-agg');
        el.textContent = dati[chiave] ? ('Ultima prima pagina: ' + dati[chiave]) : 'Data non disponibile';
      });
    })
    .catch(() => {
      document.querySelectorAll('.data-agg').forEach(el => el.textContent = '');
    });

  function leggiPreferiti() {
    try { return JSON.parse(localStorage.getItem('preferiti') || '[]'); }
    catch(e) { return []; }
  }
  function salvaPreferiti(lista) {
    localStorage.setItem('preferiti', JSON.stringify(lista));
  }
  function riordina() {
    const preferiti = leggiPreferiti();
    const grid = document.getElementById('grid');
    const card = Array.from(grid.children);
    card.sort((a, b) => {
      const pa = preferiti.indexOf(a.dataset.chiave);
      const pb = preferiti.indexOf(b.dataset.chiave);
      const va = pa === -1 ? 999 : pa;
      const vb = pb === -1 ? 999 : pb;
      return va - vb;
    });
    card.forEach(c => grid.appendChild(c));
  }
  function aggiornaStelle() {
    const preferiti = leggiPreferiti();
    document.querySelectorAll('.card').forEach(c => {
      const btn = c.querySelector('.stella');
      btn.classList.toggle('attiva', preferiti.includes(c.dataset.chiave));
    });
  }
  function toggleFavorito(chiave, btn) {
    let preferiti = leggiPreferiti();
    if (preferiti.includes(chiave)) {
      preferiti = preferiti.filter(p => p !== chiave);
    } else {
      preferiti.push(chiave);
    }
    salvaPreferiti(preferiti);
    aggiornaStelle();
    riordina();
  }

  // --- Filtri e ricerca ---
  function aggiorna() {
    const categoriaAttiva = document.querySelector('.filtro.attivo').dataset.categoria;
    const testoRicerca = document.getElementById('ricerca').value.toLowerCase();
    let visibili = 0;
    let totali = 0;

    document.querySelectorAll('.card').forEach(c => {
      totali++;
      const categoria = c.dataset.categoria;
      const nome = c.dataset.nome.toLowerCase();
      const passaCategoria = categoriaAttiva === 'tutti' || categoria === categoriaAttiva;
      const passaRicerca = nome.includes(testoRicerca);

      if (passaCategoria && passaRicerca) {
        c.classList.remove('nascosto');
        visibili++;
      } else {
        c.classList.add('nascosto');
      }
    });

    document.getElementById('contatore').textContent = `${visibili}/${totali} prime pagine disponibili`;
  }

  document.querySelectorAll('.filtro').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filtro').forEach(b => b.classList.remove('attivo'));
      btn.classList.add('attivo');
      aggiorna();
    });
  });

  document.getElementById('ricerca').addEventListener('input', aggiorna);

  riordina();
  aggiornaStelle();
  aggiorna();
</script>
</body>
</html>
