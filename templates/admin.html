<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pannello Admin - Prime Pagine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Source Serif 4', Georgia, serif; background:#f4efe4; margin:0; padding:30px 16px; }
  .contenitore { max-width:520px; margin:0 auto; }
  h1 { font-family:'Playfair Display', serif; text-align:center; margin-bottom:4px; }
  .sotto { text-align:center; margin-bottom:26px; }
  .sotto a { color:#7a1f1f; }
  .box { background:#fffdf8; border:1px solid #d8d0ba; border-radius:6px; padding:22px; margin-bottom:22px; }
  .box h2 { font-family:'Playfair Display', serif; font-size:19px; margin-top:0; }
  input { padding:9px; border:1px solid #c9c0a6; border-radius:4px; font-family:inherit; font-size:14px; margin-right:8px; margin-bottom:8px; }
  button { padding:9px 16px; background:#1a1a1a; color:#f4efe4; border:none; border-radius:4px; cursor:pointer; font-family:'Playfair Display', serif; font-weight:700; }
  .elenco-utenti { list-style:none; padding:0; }
  .elenco-utenti li { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #eee2c8; }
  .btn-elimina { background:#7a1f1f; padding:5px 10px; font-size:13px; }
  .messaggio { background:#e4f0e0; border:1px solid #a8cf9e; padding:10px; border-radius:4px; margin-bottom:18px; text-align:center; }
</style>
</head>
<body>
<div class="contenitore">
  <h1>Pannello Admin</h1>
  <div class="sotto"><a href="/">← Torna al sito</a> &nbsp;|&nbsp; <a href="/logout">Esci</a></div>

  {% if messaggio %}<div class="messaggio">{{ messaggio }}</div>{% endif %}

  <div class="box">
    <h2>Crea nuovo utente</h2>
    <form method="POST">
      <input type="hidden" name="azione" value="aggiungi">
      <input type="text" name="nuovo_username" placeholder="Username" required>
      <input type="password" name="nuova_password" placeholder="Password" required>
      <button type="submit">Crea</button>
    </form>
  </div>

  <div class="box">
    <h2>Utenti esistenti ({{ utenti|length }})</h2>
    {% if utenti %}
    <ul class="elenco-utenti">
      {% for u in utenti %}
      <li>
        {{ u }}
        <form method="POST" style="margin:0;">
          <input type="hidden" name="azione" value="elimina">
          <input type="hidden" name="username" value="{{ u }}">
          <button type="submit" class="btn-elimina" onclick="return confirm('Eliminare {{ u }}?')">Elimina</button>
        </form>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p>Nessun utente creato oltre a te.</p>
    {% endif %}
  </div>
</div>
</body>
</html>
