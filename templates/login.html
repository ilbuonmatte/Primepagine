<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accedi - Prime Pagine</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family:'Source Serif 4', Georgia, serif; background:#f4efe4; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .riquadro { background:#fffdf8; border:1px solid #d8d0ba; border-radius:6px; padding:40px 36px; width:320px; max-width:90vw; box-shadow:0 4px 14px rgba(0,0,0,.15); text-align:center; }
  img { width:90px; margin-bottom:10px; border-radius:14px; }
  h1 { font-family:'Playfair Display', serif; font-size:26px; margin:0 0 24px; }
  input { width:100%; padding:10px; margin-bottom:14px; border:1px solid #c9c0a6; border-radius:4px; box-sizing:border-box; font-family:inherit; font-size:15px; }
  button { width:100%; padding:11px; background:#1a1a1a; color:#f4efe4; border:none; border-radius:4px; font-size:15px; cursor:pointer; font-family:'Playfair Display', serif; font-weight:700; }
  .errore { color:#7a1f1f; font-size:14px; margin-bottom:14px; }
</style>
</head>
<body>
<div class="riquadro">
  <img src="/static/logo.png" alt="Logo">
  <h1>Prime Pagine</h1>
  {% if errore %}<div class="errore">{{ errore }}</div>{% endif %}
  <form method="POST">
    <input type="text" name="username" placeholder="Username" required autofocus>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit">Accedi</button>
  </form>
</div>
</body>
</html>
