<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Pagine - Libero e La Verità</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; margin:0; padding:20px; }
  h1 { text-align:center; color:#222; }
  .grid { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; align-items:flex-start; }
  .card { background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,.15); overflow:hidden; width:500px; max-width:95vw; }
  .card h2 { margin:0; padding:12px; background:#111; color:#fff; font-size:18px; text-align:center; }
  .card img { width:100%; height:auto; display:block; object-fit:contain; }
</style>
</head>
<body>
<h1>📰 Prime Pagine di Oggi</h1>
<div class="grid">
  <div class="card">
    <h2>Libero</h2>
    <img src="/img/libero" alt="Prima pagina Libero">
  </div>
  <div class="card">
    <h2>La Verità</h2>
    <img src="/img/laverita" alt="Prima pagina La Verità">
  </div>
</div>
</body>
</html>
